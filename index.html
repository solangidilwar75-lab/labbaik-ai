<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Labbaik AI</title>
<style>
body {
  margin:0;
  font-family:Arial,sans-serif;
  background:#101827;
  color:white;
}
header {
  text-align:center;
  padding:25px;
  background:#17243a;
  border-bottom:1px solid #b99b52;
}
h1 {color:#e5c477;margin:5px}
main {
  max-width:650px;
  margin:25px auto;
  padding:15px;
}
#chat {
  height:55vh;
  overflow-y:auto;
  background:#17243a;
  border-radius:15px;
  padding:15px;
}
.msg {
  padding:12px;
  margin:10px 0;
  border-radius:12px;
  line-height:1.5;
}
.bot {background:#263750}
.user {background:#765b30;text-align:right}
.controls {display:flex;gap:8px;margin-top:15px}
input {
  flex:1;
  min-width:0;
  padding:14px;
  border-radius:10px;
  border:0;
  font-size:16px;
}
button {
  background:#d5b568;
  color:#101827;
  border:0;
  padding:12px 18px;
  border-radius:10px;
  font-weight:bold;
}
footer{text-align:center;color:#aaa;padding:20px}
</style>
</head>
<body>
<header>
<h1>LABBAIK AI</h1>
<p>Your Intelligent AI Assistant</p>
</header>
<main>
<div id="chat">
<div class="msg bot">
Assalamu Alaikum! Welcome to Labbaik AI.
<br>Ask me anything in Urdu, English or Arabic.
</div>
</div>
<div class="controls">
<input id="question" placeholder="Write your question...">
<button onclick="sendMessage()">Send</button>
</div>
</main>
<footer>Powered by Labbaik AI</footer>
<script>
function sendMessage() {
 const input=document.getElementById("question");
 const chat=document.getElementById("chat");
 const q=input.value.trim();
 if(!q)return;
 chat.innerHTML += '<div class="msg user"></div>';
 chat.lastElementChild.textContent=q;
 chat.innerHTML += '<div class="msg bot"></div>';
 chat.lastElementChild.textContent=
 "Your message received! AI connection is being configured.";
 input.value="";
 chat.scrollTop=chat.scrollHeight;
}
</script>
</body>
</html>
