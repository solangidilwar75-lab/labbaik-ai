<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101827">
<title>Labbaik AI</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#101827;color:white;min-height:100vh}
header{text-align:center;padding:22px 15px;background:#17243a;border-bottom:1px solid #b99b52}
h1{color:#e5c477;margin:5px;font-size:28px}header p{margin:7px 0 0;color:#d7deea}
main{max-width:760px;margin:22px auto;padding:0 14px}
#chat{height:62vh;min-height:330px;overflow-y:auto;background:#17243a;border:1px solid #30425d;border-radius:15px;padding:15px}
.msg{padding:12px 14px;margin:10px 0;border-radius:12px;line-height:1.55;white-space:pre-wrap;overflow-wrap:anywhere}
.bot{background:#263750;margin-right:8%}.user{background:#765b30;text-align:left;margin-left:8%}
.controls{display:flex;gap:8px;margin-top:13px}
input{flex:1;min-width:0;padding:14px;border-radius:10px;border:1px solid #52627a;font-size:16px;background:#fff;color:#111}
button{background:#d5b568;color:#101827;border:0;padding:12px 18px;border-radius:10px;font-weight:bold;font-size:15px;cursor:pointer}
button:disabled{opacity:.6}footer{text-align:center;color:#aaa;padding:18px;font-size:13px}
.hint{color:#aebbd0;font-size:12px;margin:10px 2px}
</style>
</head>
<body>
<header><h1>LABBAIK AI</h1><p>Your Intelligent AI Assistant</p></header>
<main>
<div id="chat" aria-live="polite"><div class="msg bot">Assalamu Alaikum! Welcome to Labbaik AI.\nAsk me anything in Urdu, English or Arabic.</div></div>
<div class="controls"><input id="question" placeholder="Write your question..." autocomplete="off"><button id="send" onclick="sendMessage()">Send</button></div>
<div class="hint">Please do not share passwords, bank details or private information.</div>
</main>
<footer>Powered by Labbaik AI</footer>
<script>
const input=document.getElementById("question"),chat=document.getElementById("chat"),send=document.getElementById("send");
function addMessage(text,kind){const el=document.createElement("div");el.className="msg "+kind;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;return el;}
async function sendMessage(){
 const q=input.value.trim();if(!q||send.disabled)return;
 addMessage(q,"user");input.value="";send.disabled=true;send.textContent="...";
 const reply=addMessage("Jawab tayar ho raha hai...","bot");
 try{
  const response=await fetch("/api/chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({message:q})});
  const data=await response.json();
  if(!response.ok)throw new Error(data.error||"Request failed");
  reply.textContent=data.reply||"Maazrat, jawab nahi mila.";
 }catch(err){reply.textContent=err.message==="AI service is not configured yet."?"AI abhi connect nahi hua. Vercel mein OPENAI_API_KEY set karna baqi hai.":"Maazrat, connection mein masla hai. Thori dair baad dobara koshish karein.";}
 finally{send.disabled=false;send.textContent="Send";input.focus();chat.scrollTop=chat.scrollHeight;}
}
input.addEventListener("keydown",e=>{if(e.key==="Enter")sendMessage();});
</script>
</body></html>
